# .github/workflows/pages.yml
name: Build and deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit source contracts
        run: python3 scripts/audit-shared-styles.py

      - name: Build static site
        run: python3 scripts/build-site.py

      - name: Audit compiled artifact
        run: python3 scripts/audit-built-site.py _site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload compiled artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
