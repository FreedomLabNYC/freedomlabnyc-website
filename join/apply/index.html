<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Apply for Freedom Lab NYC membership.">
  <title>Membership Application | Freedom Lab NYC</title>
  <link rel="canonical" href="https://freedomlab.nyc/join/apply/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" href="/static/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/join-application-final.css?v=4">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Membership Application | Freedom Lab NYC">
  <meta property="og:description" content="Apply for Freedom Lab NYC membership.">
  <meta property="og:image" content="https://freedomlab.nyc/static/img/FL%20Signature%20Rectangular2.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Membership Application | Freedom Lab NYC">
  <meta name="twitter:description" content="Apply for Freedom Lab NYC membership.">
  <meta name="twitter:image" content="https://freedomlab.nyc/static/img/FL%20Signature%20Rectangular2.png">
</head>
<body class="single-page-application">
  <div class="apply-page">
    <a class="apply-brand" href="/join/" aria-label="Back to Freedom Lab memberships">
      <picture><source srcset="/static/img/FLNYC 2LINE+LOGO.webp" type="image/webp"><img src="/static/img/FLNYC 2LINE+LOGO.png" alt="Freedom Lab NYC" width="869" height="494"></picture>
    </a>
    <main class="apply-main">
      <div class="apply-header"><h1>Membership Application</h1></div>
      <div class="apply-rule"></div>
      <p class="apply-intro">Complete the form to apply for Freedom Lab membership.</p>

      <form id="membershipApplication" class="application-form single-page-form" novalidate>
        <section class="apply-step">
          <h2>Application details</h2>
          <div class="apply-grid single-page-grid">
            <div class="field"><label for="firstName">First name <span class="required">*</span></label><input id="firstName" name="first_name" type="text" autocomplete="given-name" placeholder="First name" required></div>
            <div class="field"><label for="lastName">Last name <span class="required">*</span></label><input id="lastName" name="last_name" type="text" autocomplete="family-name" placeholder="Last name" required></div>
            <div class="field"><label for="email">Email address <span class="required">*</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
            <div class="field"><label for="socialPlatform">Social platform link</label><input id="socialPlatform" name="social_platform_link" type="text" inputmode="url"></div>

            <div class="application-columns span-2">
              <div class="application-column">
                <div class="field"><label for="eventsAttended">Have you attended a Freedom Lab event before?</label><input id="eventsAttended" name="events_attended" type="text"><p class="field-help">If so, which one</p></div>
                <fieldset class="field interest-ranking" data-interest-ranking>
                  <legend>Rank your interest in joining Freedom Lab <span class="required">*</span></legend>
                  <p class="field-help ranking-help">Choose your top three using each rank once.</p>
                  <div class="ranking-options">
                    <label class="rank-option"><span>Coworking space</span><select data-interest-rank data-interest-label="Coworking space" aria-label="Rank Coworking space"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                    <label class="rank-option"><span>Developing freedom tech</span><select data-interest-rank data-interest-label="Developing freedom tech" aria-label="Rank Developing freedom tech"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                    <label class="rank-option"><span>Community</span><select data-interest-rank data-interest-label="Community" aria-label="Rank Community"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                    <label class="rank-option"><span>Teaching freedom tech</span><select data-interest-rank data-interest-label="Teaching freedom tech" aria-label="Rank Teaching freedom tech"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                    <label class="rank-option"><span>Learning freedom tech</span><select data-interest-rank data-interest-label="Learning freedom tech" aria-label="Rank Learning freedom tech"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                    <label class="rank-option"><span>Helping Freedom Lab grow</span><select data-interest-rank data-interest-label="Helping Freedom Lab grow" aria-label="Rank Helping Freedom Lab grow"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                    <label class="rank-option"><span>Other</span><select data-interest-rank data-interest-label="Other" aria-label="Rank Other"><option value="">Not ranked</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
                  </div>
                </fieldset>
                <div class="field" data-other-interest hidden><label for="mainInterestOther">Other interest</label><input id="mainInterestOther" name="main_interest_other" type="text"></div>
              </div>
              <div class="application-column">
                <div class="field"><label for="freedomTechInterests">What freedom tech tools are you most interested in? <span class="required">*</span></label><textarea id="freedomTechInterests" name="freedom_tech_interests" required></textarea><p class="field-help">Please describe specific tools</p></div>
                <div class="field"><label for="references">Reference(s)</label><textarea id="references" name="references"></textarea></div>
                <div class="field"><label for="otherComments">Comments or questions?</label><textarea id="otherComments" name="other_comments"></textarea></div>
              </div>
            </div>
          </div>
          <div class="apply-actions end"><button class="apply-button" type="submit">Submit application</button></div>
        </section>

        <p class="apply-status" role="status" hidden></p>
      </form>

      <section class="apply-success" hidden>
        <h2>Application submitted</h2>
        <p>We’ll be in touch after review.</p>
      </section>
    </main>
  </div>
  <script src="/js/join-application.js?v=4"></script>
</body>
</html>
