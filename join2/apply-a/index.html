<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Freedom Lab NYC membership application design study."><title>Apply to Freedom Lab — Option A</title><link rel="canonical" href="https://freedomlab.nyc/join2/apply-a/"><link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" href="/static/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/static/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/css/styles.css?v=universal-nav-1"><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/join-application-options.css?v=universal-nav-1">
  <meta property="og:type" content="website"><meta property="og:title" content="Apply to Freedom Lab NYC"><meta property="og:description" content="Freedom Lab NYC membership application."><meta property="og:image" content="https://freedomlab.nyc/static/img/FL%20Signature%20Rectangular2.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Apply to Freedom Lab NYC"><meta name="twitter:description" content="Freedom Lab NYC membership application."><meta name="twitter:image" content="https://freedomlab.nyc/static/img/FL%20Signature%20Rectangular2.png">
</head>
<body class="application-page application-a">

  <div id="nav-placeholder"></div>
  <script src="/js/nav.js?v=universal-nav-1"></script>

  <main class="application-main">
    <a class="application-back" href="/join2/">← Memberships</a>
    <div class="application-heading"><h1>Apply to Freedom Lab</h1></div>
    <div class="form-surface">
      <form class="application-form" novalidate>
        <input type="hidden" name="membership_tier">
        <section class="form-section"><h2>Contact</h2><div class="field-row"><div class="field"><label for="a-name">Name</label><input id="a-name" name="name" type="text" autocomplete="name" required></div><div class="field"><label for="a-email">Email address</label><input id="a-email" name="email" type="email" autocomplete="email" required></div></div></section>
        <section class="form-section"><fieldset><legend>Have you been to a Freedom Lab event?</legend><div class="choice-grid"><label class="choice"><input type="radio" name="attended_event" value="yes" required><span>Yes</span></label><label class="choice"><input type="radio" name="attended_event" value="no"><span>No</span></label></div></fieldset><div class="field" data-attendance-details hidden><label for="a-events">Events attended</label><p class="field-help">If so, which one(s)?</p><input id="a-events" name="events_attended" type="text"></div></section>
        <section class="form-section"><fieldset><legend>What is your main interest in joining Freedom Lab?</legend><div class="choice-grid interest-grid"><label class="choice"><input type="radio" name="main_interest" value="Coworking space" required><span>Coworking space</span></label><label class="choice"><input type="radio" name="main_interest" value="Developing freedom tech"><span>Developing freedom tech</span></label><label class="choice"><input type="radio" name="main_interest" value="Community"><span>Community</span></label><label class="choice"><input type="radio" name="main_interest" value="Teaching freedom tech"><span>Teaching freedom tech</span></label><label class="choice"><input type="radio" name="main_interest" value="Learning freedom tech"><span>Learning freedom tech</span></label><label class="choice"><input type="radio" name="main_interest" value="Helping Freedom Lab grow"><span>Helping Freedom Lab grow</span></label><label class="choice"><input type="radio" name="main_interest" value="Other"><span>Other</span></label></div></fieldset><div class="field" data-other-interest hidden><label for="a-other">Other</label><input id="a-other" name="main_interest_other" type="text"></div></section>
        <section class="form-section"><div class="field"><label for="a-areas">What area(s) of freedom tech are you interested in?</label><textarea id="a-areas" name="freedom_tech_interests"></textarea></div><div class="field"><label for="a-references">Reference(s)</label><textarea id="a-references" name="references"></textarea></div><div class="field"><label for="a-comments">Other comments</label><textarea id="a-comments" name="comments"></textarea></div></section>
        <div class="form-actions"><button class="form-button" type="submit">Submit application</button><p class="form-status" role="status" tabindex="-1" hidden></p></div>
      </form>
    </div>
  </main>
  <div id="footer-placeholder"></div><script src="/js/footer.js"></script><script src="/js/join-application-preview.js?v=1"></script><script src="/js/social-config.js"></script>
</body>
</html>
