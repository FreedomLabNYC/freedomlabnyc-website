<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="description" content="Freedom Lab NYC membership application design study."><title>Apply to Freedom Lab — Option C</title><link rel="canonical" href="https://freedomlab.nyc/join2/apply-c/"><link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" href="/static/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/static/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/css/styles.css?v=footer-icon-tone-1"><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/join-application-options.css?v=universal-nav-1">
  <meta property="og:type" content="website"><meta property="og:title" content="Apply to Freedom Lab NYC"><meta property="og:description" content="Freedom Lab NYC membership application."><meta property="og:image" content="https://freedomlab.nyc/static/img/FL%20Signature%20Rectangular2.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Apply to Freedom Lab NYC"><meta name="twitter:description" content="Freedom Lab NYC membership application."><meta name="twitter:image" content="https://freedomlab.nyc/static/img/FL%20Signature%20Rectangular2.png">
</head>
<body class="application-page application-c">

  <div id="nav-placeholder"></div>
  <script src="/js/nav.js?v=build-partials-1"></script>

  <main class="application-main">
    <a class="application-back" href="/join2/">← Memberships</a>
    <div class="application-heading"><h1>Apply to Freedom Lab</h1><div class="step-indicator" aria-label="Application progress"><span class="step-dot active" data-step-dot="1">1</span><span class="step-dot" data-step-dot="2">2</span></div></div>
    <div class="form-surface"><form class="application-form" novalidate><input type="hidden" name="membership_tier">
      <div class="step-panel" data-step-panel="1">
        <section class="form-section"><h2>Contact</h2><div class="field"><label for="c-name">Name</label><input id="c-name" name="name" type="text" autocomplete="name" required></div><div class="field"><label for="c-email">Email address</label><input id="c-email" name="email" type="email" autocomplete="email" required></div></section>
        <section class="form-section"><h2>Events</h2><fieldset><legend>Have you been to a Freedom Lab event?</legend><div class="choice-grid"><label class="choice"><input type="radio" name="attended_event" value="yes" required><span>Yes</span></label><label class="choice"><input type="radio" name="attended_event" value="no"><span>No</span></label></div></fieldset><div class="field" data-attendance-details hidden><label for="c-events">Events attended</label><p class="field-help">If so, which one(s)?</p><input id="c-events" name="events_attended" type="text"></div></section>
        <section class="form-section"><h2>Main interest</h2><fieldset><legend>What is your main interest in joining Freedom Lab?</legend><div class="choice-grid interest-grid"><label class="choice"><input type="radio" name="main_interest" value="Coworking space" required><span>Coworking space</span></label><label class="choice"><input type="radio" name="main_interest" value="Developing freedom tech"><span>Developing freedom tech</span></label><label class="choice"><input type="radio" name="main_interest" value="Community"><span>Community</span></label><label class="choice"><input type="radio" name="main_interest" value="Teaching freedom tech"><span>Teaching freedom tech</span></label><label class="choice"><input type="radio" name="main_interest" value="Learning freedom tech"><span>Learning freedom tech</span></label><label class="choice"><input type="radio" name="main_interest" value="Helping Freedom Lab grow"><span>Helping Freedom Lab grow</span></label><label class="choice"><input type="radio" name="main_interest" value="Other"><span>Other</span></label></div></fieldset><div class="field" data-other-interest hidden><label for="c-other">Other</label><input id="c-other" name="main_interest_other" type="text"></div></section>
        <div class="form-actions"><button class="form-button" type="button" data-next>Continue</button></div>
      </div>
      <div class="step-panel" data-step-panel="2" hidden>
        <section class="form-section"><h2>Freedom tech</h2><div class="field"><label for="c-areas">What area(s) of freedom tech are you interested in?</label><textarea id="c-areas" name="freedom_tech_interests"></textarea></div></section>
        <section class="form-section"><h2>References</h2><div class="field"><label for="c-references">Reference(s)</label><textarea id="c-references" name="references"></textarea></div></section>
        <section class="form-section"><h2>Comments</h2><div class="field"><label for="c-comments">Other comments</label><textarea id="c-comments" name="comments"></textarea></div></section>
        <div class="form-actions"><button class="form-button secondary" type="button" data-back>Back</button><button class="form-button" type="submit">Submit application</button><p class="form-status" role="status" tabindex="-1" hidden></p></div>
      </div>
    </form></div>
  </main>
  <div id="footer-placeholder"></div><script src="/js/footer.js?v=build-partials-1"></script><script src="/js/join-application-preview.js?v=1"></script><script src="/js/social-config.js"></script>
</body>
</html>
